# Builds the website and puts it on GitHub Pages every time main changes.
# The site ends up at https://rmagdaleena2508-01.github.io/tribezo/
#
# Zazo's AI answers come from the Vercel function. Its address is set in
# the repository's settings as the variable TRIBEZO_API_BASE (for example
# https://tribezo.vercel.app). Without it, Zazo uses his fixed answers.

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the website
        working-directory: frontend
        env:
          VITE_BASE: /tribezo/
          VITE_API_BASE: ${{ vars.TRIBEZO_API_BASE }}
        run: |
          npm ci
          npm run build
          # GitHub Pages shows 404.html for any address it does not know,
          # so a copy of the game lets the game show its own "lost" page.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
